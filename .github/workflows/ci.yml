name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew :vault:testDebugUnitTest --no-daemon
             ./gradlew :core:testDebugUnitTest --no-daemon
             ./gradlew :account:testDebugUnitTest --no-daemon
             ./gradlew :webview-bridge:testDebugUnitTest --no-daemon
             ./gradlew :did:testDebugUnitTest --no-daemon
             ./gradlew :wallet:testDebugUnitTest--no-daemon
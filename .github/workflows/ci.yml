name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Skip tests on direct pushes whose head commit message starts with
    # chore:/ci:/docs: (conventional-commit prefix). Pull requests always run.
    if: >-
      github.event_name == 'pull_request' ||
      (github.event.head_commit != null &&
        !startsWith(github.event.head_commit.message, 'chore:') &&
        !startsWith(github.event.head_commit.message, 'ci:') &&
        !startsWith(github.event.head_commit.message, 'docs:'))

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          ./gradlew :vault:testDebugUnitTest --no-daemon
          ./gradlew :core:testDebugUnitTest --no-daemon
          ./gradlew :account:testDebugUnitTest --no-daemon
          ./gradlew :webview-bridge:testDebugUnitTest --no-daemon
          ./gradlew :did:testDebugUnitTest --no-daemon
          ./gradlew :wallet:testDebugUnitTest --no-daemon
          ./gradlew :nft:testDebugUnitTest --no-daemon
          ./gradlew :dapp-connect:testDebugUnitTest --no-daemon
          ./gradlew :apk-verify:testDebugUnitTest --no-daemon
          ./gradlew :app-update:testDebugUnitTest --no-daemon